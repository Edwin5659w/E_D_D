<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opciones de Torneo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 320px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
        }
        .button {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 20px;
            margin-top: 20px;
            background-color: #003080;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            justify-content: space-between;
            gap: 15px;
        }
        .button:hover {
            background-color: #0055cc;
        }
        .btn-cancel {
            background-color: gray;
            color: black;
            border-radius: 30px;
            justify-content: center;
        }
        .btn-cancel:hover {
            background-color: #606060;
        }
        .icon {
            width: 50px;
        }
    </style>
    <script>
        function irAFiltros() {
            location.href = "filtros.html"; // Redirige a filtros.html
        }

        function irAEntrenamiento() {
            location.href = "entrenamiento.html"; // Redirige a entrenamiento.html
        }

        function irATorneos() {
            location.href = "Ctorneo.html"; // Redirige a Ctorneo.html
        }
    </script>
</head>
<body>
    <div class="container">
        <button class="button" onclick="irATorneos()">
            Torneos
            <img src="https://cdn-icons-png.flaticon.com/128/3116/3116420.png" alt="Trofeo" class="icon">
        </button>
        <button class="button" onclick="irAEntrenamiento()">
            Entrenamiento
            <img src="https://cdn-icons-png.flaticon.com/128/4799/4799625.png" alt="Calendario" class="icon">
        </button>
        <button class="button btn-cancel" onclick="irAFiltros()">CANCELAR</button>
    </div>
</body>
</html>
